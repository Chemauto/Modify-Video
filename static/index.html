<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modify Video · 视频剪辑工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='5' fill='%236366f1'/%3E%3Cpath d='M13 11.5v9l8-4.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="6" width="28" height="20" rx="6" fill="url(#lg)"/><path d="M13 11.5v9l8-4.5z" fill="#fff"/><defs><linearGradient id="lg" x1="2" y1="6" x2="30" y2="26"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
      <span class="name">Modify Video</span><span>剪辑 · 变速 · 格式转换 · GIF</span>
    </div>
    <button id="btnUpdate" class="btn ghost small-btn">⟳ 检查更新</button>
  </div>
  <div id="envBadge" class="env">正在检查 FFmpeg…</div>
</header>

<main>
  <!-- 左侧：预览区 -->
  <section class="card stage">
    <div id="empty" class="empty">
      <svg class="empty-icon" viewBox="0 0 64 64" fill="none"><rect x="6" y="12" width="52" height="40" rx="9" stroke="url(#lg2)" stroke-width="2.5"/><path d="M27 26.5v11l10.5-5.5z" fill="url(#lg2)"/><path d="M20 6.5h24M12 6.5h2M50 6.5h2" stroke="url(#lg2)" stroke-width="2.5" stroke-linecap="round" opacity=".5"/><defs><linearGradient id="lg2" x1="6" y1="12" x2="58" y2="52"><stop stop-color="#8b7bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
      <h2>选择一个视频开始</h2>
      <div class="feat-row">
        <span class="feat">时间轴裁剪</span>
        <span class="feat">0.25×–4× 变速</span>
        <span class="feat">一键转 GIF</span>
        <span class="feat">多格式互转</span>
      </div>
      <div class="empty-actions">
        <button id="btnPick" class="btn primary">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M10 2a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H3a1 1 0 1 1 0-2h6V3a1 1 0 0 1 1-1z"/></svg>
          选择视频文件
        </button>
        <div class="path-row">
          <input id="pathInput" type="text" spellcheck="false" placeholder="或粘贴视频完整路径，如 D:\Videos\demo.mp4">
          <button id="btnLoad" class="btn">加载</button>
        </div>
        <p class="hint">也可以把文件直接拖进本窗口 · 支持 MP4 / WebM / MOV / MKV / AVI / GIF 等</p>
      </div>
    </div>

    <div id="player" class="player" hidden>
      <div class="video-wrap">
        <video id="video" controls playsinline></video>
        <img id="gifView" class="gif-view" hidden alt="">
      </div>
      <div id="meta" class="meta"></div>

      <div class="timeline" id="tl">
        <div class="tl-ruler" id="ruler"></div>
        <div class="tl-track">
          <div class="tl-film no-thumb" id="film"></div>
          <div class="tl-dim" id="dimL"></div>
          <div class="tl-sel" id="sel"></div>
          <div class="tl-dim" id="dimR"></div>
        </div>
        <div class="tl-handle" id="hA" title="起点"></div>
        <div class="tl-handle" id="hB" title="终点"></div>
        <div class="tl-playhead" id="ph"></div>
      </div>
      <div class="tl-times">
        <span id="tA">00:00.0</span>
        <span id="tCur">00:00.0</span>
        <span id="tB">00:00.0</span>
      </div>

      <div class="transport">
        <button id="btnPlay" class="btn icon-btn" title="播放 / 暂停">
          <svg id="icPlay" viewBox="0 0 20 20" width="15" height="15" fill="currentColor"><path d="M6 4l10 6-10 6z"/></svg>
          <svg id="icPause" viewBox="0 0 20 20" width="15" height="15" fill="currentColor" style="display:none"><path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z"/></svg>
          <span id="playLabel">播放</span>
        </button>
        <button id="btnSetIn" class="btn ghost">设为起点</button>
        <button id="btnSetOut" class="btn ghost">设为终点</button>
        <button id="btnReset" class="btn ghost">全选</button>
        <label class="chk"><input type="checkbox" id="chkLoop" checked>循环播放选段</label>
        <span class="spacer"></span>
        <span id="selLabel" class="sel-label"></span>
        <button id="btnChange" class="btn ghost">换个文件</button>
      </div>
    </div>
  </section>

  <!-- 右侧：导出设置 -->
  <aside class="card panel">
    <h3>导出设置</h3>

    <div class="field">
      <label>输出格式</label>
      <div class="seg" id="fmtSeg">
        <button data-fmt="mp4" class="active">MP4</button>
        <button data-fmt="webm">WebM</button>
        <button data-fmt="gif">GIF</button>
        <button data-fmt="mkv">MKV</button>
        <button data-fmt="avi">AVI</button>
        <button data-fmt="mov">MOV</button>
      </div>
      <p id="fmtNote" class="hint">画质与原片一致时将直接流复制，速度极快</p>
    </div>

    <div id="gifOpts" class="field" hidden>
      <label>GIF 帧率 <b id="gifFpsVal">12</b> fps</label>
      <input type="range" id="gifFps" min="5" max="30" step="1" value="12">
      <label>GIF 宽度</label>
      <select id="gifWidth">
        <option value="240">240 px</option>
        <option value="360">360 px</option>
        <option value="480" selected>480 px</option>
        <option value="640">640 px</option>
        <option value="0">保持原始宽度</option>
      </select>
    </div>

    <div class="field">
      <label>播放速度 <b id="speedVal">1.00×</b></label>
      <input type="range" id="speed" min="0.25" max="4" step="0.05" value="1">
      <div class="chips" id="speedChips">
        <button data-speed="0.5">0.5×</button>
        <button data-speed="1" class="active">1×</button>
        <button data-speed="1.5">1.5×</button>
        <button data-speed="2">2×</button>
        <button data-speed="3">3×</button>
      </div>
      <p class="hint">预览会即时变速，导出按此速度处理（含声音）</p>
    </div>

    <button id="btnExport" class="btn primary big" disabled>
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><path d="M10 2l4 4h-3v6H9V6H6l4-4zM3 12v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4h-2v4H5v-4H3z"/></svg>
      开始导出
    </button>

    <div id="prog" class="prog" hidden>
      <div class="bar"><i id="progBar"></i></div>
      <div class="prog-row">
        <span id="progText">正在处理…</span>
        <button id="btnCancel" class="btn ghost danger">取消</button>
      </div>
    </div>

    <div id="result" class="result" hidden>
      <p class="ok-line"><svg viewBox="0 0 20 20" width="16" height="16" fill="#4ade80"><path d="M10 0a10 10 0 1 0 0 20A10 10 0 0 0 10 0zm4.7 7.3l-5.6 5.6a1 1 0 0 1-1.4 0L5.3 10.5a1 1 0 1 1 1.4-1.4l1.7 1.7 4.9-4.9a1 1 0 1 1 1.4 1.4z"/></svg> <span id="okLineText">导出完成</span></p>
      <p id="outPath" class="out-path"></p>
      <div class="result-actions">
        <button id="btnReveal" class="btn">打开所在文件夹</button>
        <button id="btnPreviewOut" class="btn ghost">预览结果</button>
        <button id="btnBackEdit" class="btn ghost" hidden>返回编辑原视频</button>
      </div>
    </div>
  </aside>
</main>

<div id="updatePanel" class="update-panel card" hidden></div>
<div id="dropOverlay" hidden><div class="drop-box"><div>松开以载入视频</div></div></div>
<div id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
